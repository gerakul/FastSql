name: Tests

on:
  push:
    branches: [ master, modernization ]
  pull_request:
    branches: [ master, modernization ]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build:
    name: Build solution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/Directory.Build.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # the whole solution, so build breaks in Examples are caught too
      - name: Build
        run: dotnet build FastSql.slnx --configuration Release

  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Unit tests
            project: tests/Gerakul.FastSql.UnitTests
            results: unit-tests
          # Docker is preinstalled on ubuntu-latest; the database images are pulled on first use
          - name: Integration tests
            project: tests/Gerakul.FastSql.IntegrationTests
            results: integration-tests
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/Directory.Build.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Run tests
        run: >-
          dotnet test
          --project ${{ matrix.project }}
          --configuration Release
          --results-directory TestResults
          --report-xunit-trx --report-xunit-trx-filename ${{ matrix.results }}.trx
          --coverage --coverage-output-format cobertura --coverage-output ${{ matrix.results }}.cobertura.xml

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.results }}
          path: TestResults
          if-no-files-found: warn
